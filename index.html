<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สารบัญเว็บ AMT Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1419;--card:#1a2129;--line:#2a3440;--text:#e6edf3;--muted:#8b98a5;--accent:#4fb3a9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Sarabun',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:56px 20px}
h1{font-size:2rem;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 36px}
.list{display:grid;gap:14px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;text-decoration:none;color:var(--text);transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card h2{font-size:1.15rem;margin:0 0 4px}
.card .meta{color:var(--muted);font-size:.9rem}
.card .url{color:var(--accent);font-size:.85rem;margin-top:6px;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
<h1>สารบัญเว็บ AMT Group</h1>
<p class="sub">บริษัท สำนักงาน เอ.เอ็ม.ที. ออดิท กรุ๊ป จำกัด</p>
<div class="list">
<!-- รายการเว็บ: เพิ่มต่อท้าย -->
<a class="card" href="amt-financial-statement-uat/">
<h2>AMT Financial Statement V1 (Test UAT)</h2>
<div class="meta">6 ต.ค. 2569</div>
<div class="url">/amt-financial-statement-uat/</div>
</a>
</div>
</div>
</body>
</html>
