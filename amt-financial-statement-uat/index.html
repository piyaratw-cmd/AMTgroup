          if(v.indexOf('description')>=0||v.indexOf('\u0e23\u0e32\u0e22\u0e01\u0e32\u0e23')>=0)nc=c;
        }
        if(fd&&fc2){hdr=r;break;}
      }
      if(hdr<0){hdr=1;dc=2;cc=4;nc=1;}
      var result=[],tdr=0,tcr=0;
      for(var r=hdr+1;r<rows.length;r++){
        var row=rows[r];if(!row)continue;
        var d=String(row[nc]||'').trim();
        if(!d||/^(total|\u0e23\u0e27\u0e21|TOTAL|grand)/i.test(d))continue;
        var dr=parseFloat(String(row[dc]||'').replace(/,/g,''))||0;
        var cr=parseFloat(String(row[cc]||'').replace(/,/g,''))||0;
        if(dr===0&&cr===0)continue;
        tdr+=dr;tcr+=cr;
        result.push({desc:d,dr:dr,cr:cr,no:acNo(d)});
      }
      cb(null,{rows:result,totalDr:tdr,totalCr:tcr});
    }catch(err){cb(err,null);}
  };
  reader.readAsArrayBuffer(file);
}

function mapAccounts(rows){
  return rows.map(function(row){
    var no=row.no,idx=null,src='',conf='high';
    var p=no?no.charAt(0):'';
    if(no&&PRYR[no]){idx=PRYR[no];src='prior';}
    else if(p==='3'){src='equity';}
    else if(p==='5'){var fz=findIdx(row.desc);idx=fz.code&&fz.conf!=='low'?fz.code:'X1';src='prefix';conf=fz.conf;}
    else if(p==='6'){var fz=findIdx(row.desc);idx=fz.code&&fz.conf!=='low'?fz.code:'X4';src='prefix';conf=fz.conf;}
    else{var fz=findIdx(row.desc);idx=fz.code;src='dbd';conf=fz.conf;}
    return Object.assign({},row,{idx:idx,src:src,conf:conf});
  });
}

function genExcel(mapped){
  /* Load template */
  var wb=XLSX.read(TB64,{type:'base64',cellStyles:true,cellNF:true,cellDates:true,bookFiles:true});
  var ws68=wb.Sheets['Pending 68'];
  var wsBS=wb.Sheets['BS-PL'];
  if(!ws68)throw new Error('\u0e44\u0e21\u0e48\u0e1e\u0e1a Sheet Pending 68');
  if(!wsBS)throw new Error('\u0e44\u0e21\u0e48\u0e1e\u0e1a Sheet BS-PL');

  /* ── Pending 68: write data rows ── */
  var startR=7;
  mapped.forEach(function(a,i){
    var r=startR+i;
    /* Preserve existing cell style (for rows that had default style in template) */
    var existK=ws68['K'+r];var sK=existK&&existK.s?existK.s:undefined;
    ws68['A'+r]={v:a.desc,t:'s'};
    if(a.dr>0){ws68['I'+r]={v:a.dr,t:'n'};}else{delete ws68['I'+r];}
    if(a.cr>0){ws68['J'+r]={v:a.cr,t:'n'};}else{delete ws68['J'+r];}
    /* col K formula: =+I{r}-J{r} (MUST have + prefix to match template) */
    var kCell={f:'+I'+r+'-J'+r,t:'n',v:a.dr-a.cr};
    if(sK)kCell.s=sK;
    ws68['K'+r]=kCell;
    if(a.idx&&a.src!=='equity'){ws68['L'+r]={v:a.idx,t:'s'};}else{delete ws68['L'+r];}
  });
  /* Extend !ref */
  var lastR=startR+mapped.length-1;
  var oRef=ws68['!ref']||'A1:K59';
  var oLast=parseInt((oRef.split(':')[1]||'K59').replace(/[^0-9]/g,''))||59;
  ws68['!ref']='A1:L'+Math.max(lastR,oLast);
  /* Re-apply Pending 68 merge ranges */
  ws68['!merges']=MERGES_P68;

  /* ── BS-PL: write SUMIF to col J, preserve existing style ── */
  BSPL.forEach(function(item){
    var r=item.r;
    /* Preserve existing J cell style */
    var existJ=wsBS['J'+r];
    var sJ=existJ&&existJ.s?existJ.s:undefined;
    var f=item.s==='-'
      ?"-SUMIF('Pending 68'!L:L,'BS-PL'!M"+r+",'Pending 68'!K:K)"
      :"SUMIF('Pending 68'!L:L,'BS-PL'!M"+r+",'Pending 68'!K:K)";
    var jCell={f:f,t:'n',v:0};
    if(sJ)jCell.s=sJ;
    wsBS['J'+r]=jCell;
  });
  /* Restore BS-PL col L cached values */
  Object.keys(LCACHE).forEach(function(row){
    var v=LCACHE[row];
    if(v!==null&&v!==undefined){
      var t=typeof v==='number'?'n':'s';
      wsBS['L'+row]={v:v,t:t};
    }
  });
  /* Re-apply ALL BS-PL merge ranges (critical for header centering) */
  wsBS['!merges']=MERGES_BS;

  return XLSX.write(wb,{bookType:'xlsx',type:'array',compression:true});
}

function buildSM(m){
  return{total:m.length,
    prior:m.filter(function(a){return a.src==='prior';}).length,
    high:m.filter(function(a){return a.src!=='prior'&&a.src!=='equity'&&a.conf==='high';}).length,
    mid:m.filter(function(a){return a.conf==='mid';}).length,
    none:m.filter(function(a){return !a.idx&&a.src!=='equity';}).length,
    eq:m.filter(function(a){return a.src==='equity';}).length};
}

function showModal(dr,cr){
  var diff=Math.abs(dr-cr),ok=diff<1;
  document.getElementById('mb').innerHTML=
    '<div class="mi">'+(ok?'\u2705':'\u274c')+'</div>'
    +'<div class="mt" style="color:'+(ok?'#2e7d32':'#c62828')+'">'+(ok?'TB \u0e1c\u0e48\u0e32\u0e19 Balance':'TB \u0e44\u0e21\u0e48\u0e1c\u0e48\u0e32\u0e19')+'</div>'
    +'<div class="ms">'+(ok?'Debit = Credit':'\u0e2d\u0e31\u0e1b\u0e42\u0e2b\u0e25\u0e14\u0e43\u0e2b\u0e21\u0e48')+'</div>'
    +'<div class="mtbl">'
    +'<div class="mr"><span>Total Debit</span><span class="vn">'+fN(dr)+'</span></div>'
    +'<div class="mr"><span>Total Credit</span><span class="vn">'+fN(cr)+'</span></div>'
    +'<div class="mr"><span>Difference</span><span class="'+(ok?'vo':'ve')+'">'+fN(diff)+(ok?' \u2713':' \u2717')+'</span></div>'
    +'</div>'
    +'<button class="btn '+(ok?'bg':'bp')+'" onclick="closeModal('+(ok?'true':'false')+')">'+
    (ok?'\u2713 \u0e14\u0e33\u0e40\u0e19\u0e34\u0e19\u0e01\u0e32\u0e23\u0e15\u0e48\u0e2d':'\u0e1b\u0e34\u0e14')+'</button>';
  document.getElementById('mov').style.display='flex';
}
function closeModal(ok){document.getElementById('mov').style.display='none';if(ok===true||ok==='true')S.step=1;render();}
document.getElementById('mov').onclick=function(e){if(e.target===this)closeModal(false);};

function handleFile(f){S.file=f;S.err=null;parseTB(f,function(err,r){if(err){S.err='\u0e2d\u0e48\u0e32\u0e19\u0e44\u0e1f\u0e25\u0e4c\u0e44\u0e21\u0e48\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08: '+err.message;render();return;}S.tb=r;showModal(r.totalDr,r.totalCr);});}
function resetFile(){S={step:0,file:null,tb:null,mapped:null,prog:0,sm:null,buf:null,err:null};render();}
function doGen(){
  S.step=2;S.prog=0;S.err=null;render();
  setTimeout(function(){
    S.mapped=mapAccounts(S.tb.rows);S.sm=buildSM(S.mapped);S.prog=50;render();
    setTimeout(function(){
      try{S.buf=genExcel(S.mapped);S.prog=100;S.step=3;render();}
      catch(e){S.err='\u0e2a\u0e23\u0e49\u0e32\u0e07\u0e44\u0e1f\u0e25\u0e4c\u0e44\u0e21\u0e48\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08: '+e.message;S.step=1;render();}
    },500);
  },300);
}
function doDL(){
  if(!S.buf)return;
  var blob=new Blob([new Uint8Array(S.buf)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Draft_T2_2568.xlsx';
  document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);},1000);
}
function setupDZ(){
  var dz=document.getElementById('dz');if(!dz)return;
  dz.ondragover=function(e){e.preventDefault();dz.classList.add('ov');};
  dz.ondragleave=function(){dz.classList.remove('ov');};
  dz.ondrop=function(e){e.preventDefault();dz.classList.remove('ov');if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0]);};
  dz.onclick=function(){document.getElementById('fi').click();};
}
document.getElementById('fi').onchange=function(e){if(e.target.files[0])handleFile(e.target.files[0]);};

function render(){
  var h='',st=S.step;
  h+='<div class="sec '+(st===0?'a':st>=1?'d':'a')+'">'
   +'<div class="sh'+(st>=1?' dh':'')+'"><div class="sn '+(st>=1?'dn':'an')+'">'+(st>=1?'\u2713':'1')+'</div>'
   +'<div class="st">\u0e2d\u0e31\u0e1b\u0e42\u0e2b\u0e25\u0e14 Trial Balance</div>'
   +(st>=1?'<span class="badge bd">\u0e2d\u0e31\u0e1b\u0e42\u0e2b\u0e25\u0e14\u0e41\u0e25\u0e49\u0e27</span>':'<span class="badge ba">\u0e01\u0e33\u0e25\u0e31\u0e07\u0e43\u0e0a\u0e49\u0e07\u0e32\u0e19</span>')
   +'</div><div class="sb">';
  if(st===0){
    h+='<div class="dz" id="dz"><div style="font-size:38px;margin-bottom:8px">\ud83d\udcca</div>'
     +'<div style="font-weight:600;font-size:15px;color:#1a237e;margin-bottom:4px">\u0e25\u0e32\u0e01\u0e27\u0e32\u0e07\u0e44\u0e1f\u0e25\u0e4c \u0e2b\u0e23\u0e37\u0e2d\u0e04\u0e25\u0e34\u0e01\u0e40\u0e1e\u0e37\u0e48\u0e2d\u0e40\u0e25\u0e37\u0e2d\u0e01</div>'
     +'<div style="color:#9fa8da;font-size:12px">TB (.xlsx) \u00b7 \u0e23\u0e2d\u0e07\u0e23\u0e31\u0e1a\u0e17\u0e38\u0e01 Format</div></div>';
    if(S.err)h+='<div class="eb">'+S.err+'</div>';
  }else{
    var fn=S.file?S.file.name:'-',cnt=S.tb?S.tb.rows.length:0;
    h+='<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:#f0fdf4;border-radius:8px;border:1px solid #a7f3d0">'
     +'<div style="font-size:22px">\ud83d\udcca</div><div>'
     +'<div style="font-size:13px;font-weight:600;color:#065f46">'+fn+'</div>'
     +'<div style="font-size:11px;color:#6b7280;margin-top:1px">'+cnt+' \u0e23\u0e32\u0e22\u0e01\u0e32\u0e23 \u00b7 Balance \u2713</div></div>'
     +(st===1?'<div style="margin-left:auto;cursor:pointer;color:#9e9e9e;font-size:20px" onclick="resetFile()">&times;</div>':'')+'</div>';
  }
  h+='</div></div>';

  var s2c='sec '+(st>=3?'d':st>=1?'a':'lk');
  h+='<div class="'+s2c+'"><div class="sh'+(st>=3?' dh':'')+'"><div class="sn '+(st>=3?'dn':st>=1?'an':'ln')+'">'+(st>=3?'\u2713':'2')+'</div>'
   +'<div class="st">\u0e2a\u0e23\u0e49\u0e32\u0e07\u0e07\u0e1a\u0e01\u0e32\u0e23\u0e40\u0e07\u0e34\u0e19</div>'
   +(st>=3?'<span class="badge bd">\u0e40\u0e2a\u0e23\u0e47\u0e08</span>':st===2?'<span class="badge ba">\u0e01\u0e33\u0e25\u0e31\u0e07\u0e2a\u0e23\u0e49\u0e32\u0e07...</span>':st===1?'<span class="badge ba">\u0e1e\u0e23\u0e49\u0e2d\u0e21</span>':'<span class="badge bw">\u0e23\u0e2d</span>')
   +'</div><div class="sb">';
  if(st===1){h+='<button class="btn bp" onclick="doGen()">\u25b6 \u0e2a\u0e23\u0e49\u0e32\u0e07\u0e07\u0e1a\u0e01\u0e32\u0e23\u0e40\u0e07\u0e34\u0e19</button>'+(S.err?'<div class="eb">'+S.err+'</div>':'');}
  else if(st===2){h+='<div class="pw"><div class="pb" style="width:'+S.prog+'%"></div></div><div class="pl">\u0e01\u0e33\u0e25\u0e31\u0e07\u0e1b\u0e23\u0e30\u0e21\u0e27\u0e25\u0e1c\u0e25 '+S.prog+'%</div>';}
  else if(st>=3&&S.sm){var sm=S.sm;h+='<div class="smb"><b>\u0e1a\u0e31\u0e0d\u0e0a\u0e35:</b> '+sm.total+' \u0e23\u0e32\u0e22\u0e01\u0e32\u0e23<br>\u2705 <b>Map \u0e1b\u0e35\u0e01\u0e48\u0e2d\u0e19:</b> '+sm.prior+(sm.high?'<br>\ud83d\udfe2 <b>DBD High:</b> '+sm.high:'')+(sm.mid?'<br>\ud83d\udfe1 <b>DBD Mid:</b> '+sm.mid:'')+(sm.none?'<br>\ud83d\udd34 <b>\u0e44\u0e21\u0e48\u0e21\u0e35 Index:</b> '+sm.none:'')+(sm.eq?'<br>\ud83d\udfe3 <b>Equity:</b> '+sm.eq:'')+'</div>';}
  else{h+='<div style="text-align:center;color:#bbb;font-size:13px;padding:4px 0">\u0e2d\u0e31\u0e1b\u0e42\u0e2b\u0e25\u0e14 TB \u0e01\u0e48\u0e2d\u0e19</div>';}
  h+='</div></div>';

  var s3c='sec '+(st>=3?'d':'lk');
  h+='<div class="'+s3c+'"><div class="sh'+(st>=3?' dh':'')+'"><div class="sn '+(st>=3?'dn':'ln')+'">'+(st>=3?'\u2713':'3')+'</div>'
   +'<div class="st">Export Excel</div>'
   +(st>=3?'<span class="badge bd">\u0e1e\u0e23\u0e49\u0e2d\u0e21 Download</span>':'<span class="badge bw">\u0e23\u0e2d</span>')
   +'</div><div class="sb">';
  if(st>=3){h+='<div class="dlc"><div style="font-size:40px;margin-bottom:8px">\ud83d\udce5</div><div style="font-size:16px;font-weight:700;margin-bottom:4px">\u0e07\u0e1a Draft \u0e1e\u0e23\u0e49\u0e2d\u0e21\u0e41\u0e25\u0e49\u0e27</div><div class="dls">Draft_T2_2568.xlsx \u00b7 Pending 68 \u00b7 BS-PL SUMIF \u00b7 Formatting \u0e04\u0e23\u0e1a</div><button class="dlb" onclick="doDL()">\u2b07 \u0e14\u0e32\u0e27\u0e19\u0e4c\u0e42\u0e2b\u0e25\u0e14 Excel</button></div><p style="font-size:12px;color:#888;text-align:center;margin-top:8px">\u0e40\u0e1b\u0e34\u0e14\u0e43\u0e19 Excel \u2192 \u0e01\u0e14 <b>F9</b> \u0e40\u0e1e\u0e37\u0e48\u0e2d\u0e04\u0e33\u0e19\u0e27\u0e13\u0e2a\u0e39\u0e15\u0e23 SUMIF</p>';}
  else{h+='<div style="text-align:center;color:#bbb;font-size:13px;padding:4px 0">\u0e2a\u0e23\u0e49\u0e32\u0e07\u0e07\u0e1a\u0e01\u0e48\u0e2d\u0e19</div>';}
  h+='</div></div>';
  document.getElementById('main').innerHTML=h;setTimeout(setupDZ,0);
}
/* Version 2 renders after the original workbook engine has loaded. */

</script>

<script id="v2-app">
/* Version 2 UI layer — preserves the original workbook generation engine. */
var V2={files:{tb:null,prior:null},tb:null,priorMap:{},priorDetails:{},busy:false,done:false,bufT2:null,error:null,pending:null};
function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];});}
function modal(html,locked){document.getElementById('mb').innerHTML=html;var m=document.getElementById('mov');m.style.display='flex';m.dataset.locked=locked?'1':'0';}
function hideV2Modal(){document.getElementById('mov').style.display='none';document.getElementById('mov').dataset.locked='0';}
document.getElementById('mov').onclick=function(e){if(e.target===this&&this.dataset.locked!=='1')hideV2Modal();};
function sniffFile(file,cb){
  var reader=new FileReader();reader.onload=function(e){try{var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'}),names=wb.SheetNames.map(function(x){return x.toLowerCase();}),name=file.name.toLowerCase();
    var looksPrior=/prior|previous|py|t2|ปี\s*ก่อน|256[0-7]/i.test(name)||names.some(function(n){return /t2|bs-pl|statement|งบการเงิน/.test(n);});
    var looksTB=/\btb\b|trial|ทดลอง|pending/i.test(name)||names.some(function(n){return /^(tb|tbdraft|trial balance|งบทดลอง)/.test(n);});
    cb(null,looksTB&&!looksPrior?'tb':looksPrior&&!looksTB?'prior':null);
  }catch(err){cb(err,null);}};reader.readAsArrayBuffer(file);
}
function receiveFile(file){if(!file)return;if(!/\.xlsx?$/.test(file.name)){showError('รองรับเฉพาะไฟล์ Excel .xlsx หรือ .xls');return;}V2.error=null;modal('<div class="v2-spinner"></div><div class="mt">กำลังตรวจสอบไฟล์</div><div class="ms">ระบบกำลังอ่านรูปแบบไฟล์โดยอัตโนมัติ</div>',true);sniffFile(file,function(err,type){if(err){hideV2Modal();showError('ไม่สามารถอ่านไฟล์นี้ได้ กรุณาตรวจสอบไฟล์แล้วลองใหม่');return;}if(type)assignFile(file,type);else{V2.pending=file;modal('<div class="mi">📄</div><div class="mt">ไฟล์นี้เป็นข้อมูลประเภทใด?</div><div class="ms">ระบบยังระบุประเภทไฟล์ไม่ได้ กรุณาเลือกเพื่อดำเนินการต่อ</div><div class="v2-choice"><button onclick="chooseType(\'tb\')">Trial Balance (TB)</button><button onclick="chooseType(\'prior\')">Prior Year T2</button></div><button class="v2-btn secondary" style="width:100%" onclick="V2.pending=null;hideV2Modal()">ยกเลิก</button>');}});}
function chooseType(type){var f=V2.pending;V2.pending=null;if(f)assignFile(f,type);}
function parseTBV2(file,cb){var reader=new FileReader();reader.onload=function(e){try{var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'}),best=null;wb.SheetNames.forEach(function(sn){var rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:null,raw:true}),hdr=-1,dc=-1,cc=-1,nc=-1,ac=-1;for(var r=0;r<Math.min(30,rows.length);r++){var row=rows[r]||[];for(var c=0;c<row.length;c++){var v=nm(row[c]);if(/^(debit|dr|เดบิต)$/.test(v))dc=c;if(/^(credit|cr|เครดิต)$/.test(v))cc=c;if(/description|account name|ชื่อบัญชี|รายการ/.test(v))nc=c;if(/account no|account code|เลขที่บัญชี/.test(v))ac=c;}if(dc>=0&&cc>=0){hdr=r;break;}}if(hdr<0)return;if(nc<0)nc=ac>=0?ac+1:Math.max(0,dc-1);var out=[],tdr=0,tcr=0;for(var i=hdr+1;i<rows.length;i++){var row=rows[i]||[],account=String(ac>=0?row[ac]||'':'').trim(),desc=String(row[nc]||'').trim();if(!account){var mm=desc.match(/^(\d[\d-]*)\s*(.*)$/);if(mm){account=mm[1];desc=mm[2]||desc;}}if(!account&&!desc)continue;if(/^(total|grand total|รวม)/i.test(desc))continue;var dr=Number(String(row[dc]||0).replace(/,/g,''))||0,cr=Number(String(row[cc]||0).replace(/,/g,''))||0;if(!dr&&!cr)continue;var full=(account?account+' ':'')+desc;out.push({account:account,no:account.replace(/-/g,''),name:desc,desc:full.trim(),dr:dr,cr:cr});tdr+=dr;tcr+=cr;}if(out.length&&(!best||out.length>best.rows.length))best={rows:out,totalDr:tdr,totalCr:tcr,sheet:sn};});if(!best)throw new Error('ไม่พบรายการบัญชี');cb(null,best);}catch(err){cb(err,null);}};reader.readAsArrayBuffer(file);}
function parsePriorMap(file,cb){(async function(){try{if(typeof ExcelJS==='undefined')throw new Error('ExcelJS ยังไม่พร้อมใช้งาน');var wb=new ExcelJS.Workbook();await wb.xlsx.load(await file.arrayBuffer());var allowed={};BSPL.forEach(function(x){allowed[x.c]=1;});var map={},details={},detected={},pendingSheets=wb.worksheets.filter(function(ws){return /pending\s*\d*/i.test(String(ws.name).trim());}).sort(function(a,b){return Number((b.name.match(/\d+/)||[0])[0])-Number((a.name.match(/\d+/)||[0])[0]);});function textOf(value){if(value===null||value===undefined)return'';if(typeof value==='object'){if(value.result!==undefined&&value.result!==null)return String(value.result).trim();if(value.text!==undefined)return String(value.text).trim();if(Array.isArray(value.richText))return value.richText.map(function(x){return x.text||'';}).join('').trim();}return String(value).trim();}function indexLike(v){return !!allowed[v]||(/^[A-Z]{1,3}\d{0,2}$/.test(v)&&!{OK:1,YES:1,NO:1,ADJ:1,DR:1,CR:1}[v]);}pendingSheets.forEach(function(ws){var accountRows=[];ws.eachRow({includeEmpty:false},function(row){var account='',description='',accountCol=0;for(var c=1;c<=ws.columnCount;c++){var value=textOf(row.getCell(c).value),m=value.match(/^(\d[\d-]*)(?:\s+(.+))?$/);if(m){account=m[1];description=m[2]||textOf(row.getCell(c+1).value);accountCol=c;break;}}if(account)accountRows.push({row:row,account:account,description:description,accountCol:accountCol});});var scores={},headerCols={};for(var hr=1;hr<=Math.min(ws.rowCount,12);hr++)for(var hc=1;hc<=ws.columnCount;hc++){var header=textOf(ws.getCell(hr,hc).value).toLowerCase();if(/index|mapping|map\s*index|รหัส.*index/.test(header))headerCols[hc]=1;}accountRows.forEach(function(item){for(var col=1;col<=ws.columnCount;col++){if(col===item.accountCol)continue;var v=textOf(item.row.getCell(col).value).toUpperCase();if(!indexLike(v))continue;scores[col]=(scores[col]||0)+(allowed[v]?4:1);}});var bestCol=0,bestScore=0;Object.keys(scores).forEach(function(col){var score=scores[col]+(headerCols[col]?1000:0);if(score>bestScore){bestScore=score;bestCol=Number(col);}});if(!bestCol){var headers=Object.keys(headerCols);if(headers.length)bestCol=Number(headers[0]);}if(bestCol)detected[ws.name]=bestCol;accountRows.forEach(function(item){if(!bestCol)return;var idx=textOf(item.row.getCell(bestCol).value).toUpperCase();if(!indexLike(idx))return;var key=item.account.replace(/-/g,'');if(!map[key]){map[key]=idx;details[key]={idx:idx,description:item.description,pending:textOf(item.row.getCell(bestCol+1).value),sheet:ws.name,indexColumn:bestCol};}});});if(!pendingSheets.length)throw new Error('ไม่พบชีตที่มีชื่อ Pending');if(!Object.keys(map).length)throw new Error('พบชีต '+pendingSheets.map(function(x){return x.name;}).join(', ')+' แต่ยังตรวจหาคอลัมน์ Index อัตโนมัติไม่ได้');cb(null,{map:map,details:details,sheets:pendingSheets.map(function(x){return x.name;}),detected:detected});}catch(err){cb(err,null);}})();}
function assignFile(file,type){hideV2Modal();V2.files[type]=file;V2.done=false;V2.bufT2=null;if(type==='tb'){modal('<div class="v2-spinner"></div><div class="mt">กำลังตรวจสอบยอด TB</div><div class="ms">ตรวจสอบ Total Debit และ Total Credit</div>',true);parseTBV2(file,function(err,r){if(err||!r||!r.rows.length||(!r.totalDr&&!r.totalCr)){hideV2Modal();V2.files.tb=null;V2.tb=null;showError('ไฟล์นี้ไม่ใช่ TB หรือไม่พบยอด Debit / Credit กรุณาเลือกไฟล์ Trial Balance');return;}V2.tb=r;showBalance(r.totalDr,r.totalCr);});}else{modal('<div class="v2-spinner"></div><div class="mt">กำลังอ่าน Mapping ปีเดิม</div><div class="ms">ระบบกำลังดึง Index และรายละเอียด Pending</div>',true);parsePriorMap(file,function(err,result){hideV2Modal();if(err||!result||!Object.keys(result.map).length){V2.files.prior=null;V2.priorMap={};V2.priorDetails={};showError(err&&err.message?err.message:'ไม่พบ Mapping ในชีต Pending ของไฟล์ Prior Year T2/T3');return;}V2.priorMap=result.map;V2.priorDetails=result.details;renderV2();var pendingCount=Object.keys(result.details).filter(function(k){return result.details[k].pending;}).length;if(missingFiles().length)showMissingUpload();else showSuccess('อ่าน Mapping ได้ '+Object.keys(result.map).length+' บัญชี และรายละเอียด Pending '+pendingCount+' รายการ');});}}
function showBalance(dr,cr){var diff=Math.abs(dr-cr),ok=diff<1;modal('<div class="mi">'+(ok?'✅':'❌')+'</div><div class="mt" style="color:'+(ok?'var(--green)':'var(--red)')+'">'+(ok?'TB Balance':'TB ไม่สมดุล')+'</div><div class="ms">'+(ok?'ยอด Debit เท่ากับ Credit พร้อมดำเนินการต่อ':'กรุณาตรวจสอบยอดในไฟล์และอัปโหลดใหม่')+'</div><div class="mtbl"><div class="mr"><span>Total Debit</span><span class="vn">'+fN(dr)+'</span></div><div class="mr"><span>Total Credit</span><span class="vn">'+fN(cr)+'</span></div><div class="mr"><span>Difference</span><span class="'+(ok?'vo':'ve')+'">'+fN(diff)+'</span></div></div><button class="v2-btn '+(ok?'primary':'secondary')+'" style="width:100%" onclick="finishBalance('+(ok?'true':'false')+')">'+(ok?'ดำเนินการต่อ':'ปิดและเลือกไฟล์ใหม่')+'</button>');}
function showMissingUpload(){var missing=missingFiles();if(!missing.length)return;modal('<div class="mi">📌</div><div class="mt" style="color:var(--amber)">ยังขาดไฟล์</div><div class="ms">อัปโหลดสำเร็จแล้ว แต่ยังต้องเพิ่ม<br><b>'+missing.join('<br>')+'</b></div><button class="v2-btn primary" style="width:100%" onclick="hideV2Modal()">รับทราบ</button>');}
function finishBalance(ok){hideV2Modal();if(!ok){V2.files.tb=null;V2.tb=null;}renderV2();if(ok&&missingFiles().length)setTimeout(showMissingUpload,80);}
function showError(msg){V2.error=msg;renderV2();modal('<div class="mi">⚠️</div><div class="mt" style="color:var(--red)">ไม่สามารถดำเนินการได้</div><div class="ms">'+esc(msg)+'</div><button class="v2-btn primary" style="width:100%" onclick="hideV2Modal()">ตกลง</button>');}
function showSuccess(msg){modal('<div class="mi">✅</div><div class="mt" style="color:var(--green)">สำเร็จ</div><div class="ms">'+esc(msg)+'</div><button class="v2-btn primary" style="width:100%" onclick="hideV2Modal()">ตกลง</button>');}
function removeV2(type){V2.files[type]=null;if(type==='tb')V2.tb=null;if(type==='prior'){V2.priorMap={};V2.priorDetails={};}V2.done=false;V2.bufT2=null;renderV2();}
function normMapText(v){return nm(v).replace(/^\d[\d-]*\s*/,'').replace(/[^a-z0-9ก-๙]+/gi,' ').trim();}
function textSimilarity(a,b){a=normMapText(a);b=normMapText(b);if(!a||!b)return 0;if(a===b)return 1;if(a.indexOf(b)>=0||b.indexOf(a)>=0)return .88;function grams(s){var x={},z=s.replace(/\s+/g,'');for(var i=0;i<z.length-1;i++)x[z.slice(i,i+2)]=1;return x;}var x=grams(a),y=grams(b),inter=0,total={};Object.keys(x).forEach(function(k){total[k]=1;if(y[k])inter++;});Object.keys(y).forEach(function(k){total[k]=1;});return Object.keys(total).length?inter/Object.keys(total).length:0;}
function fuzzyPrior(row){var key=String(row.account||row.no||'').replace(/-/g,''),cat=key.charAt(0),best=null,score=0;Object.keys(V2.priorDetails).forEach(function(k){if(k.charAt(0)!==cat)return;var d=V2.priorDetails[k],s=textSimilarity(row.name||row.desc,d.description);if(s>score){score=s;best=d;}});return best&&score>=.32?{idx:best.idx,detail:best,score:score}:null;}
function mapAccountsV2(rows){return rows.map(function(row){var key=String(row.account||row.no||'').replace(/-/g,''),idx=V2.priorMap[key]||null,src=idx?'prior-exact':'',conf='high',matchedDetail=V2.priorDetails[key]||null;if(!idx){var near=fuzzyPrior(row);if(near){idx=near.idx;src='prior-similar';conf='mid';}}if(!idx){var embedded=findIdx(row.name||row.desc);if(embedded.code&&embedded.conf!=='low'){idx=embedded.code;src='index-db';conf=embedded.conf;}}if(!idx){src='unmapped';conf='low';}return Object.assign({},row,{idx:idx,src:src,conf:conf,matchedDetail:matchedDetail});});}
function yellowStyle(style){var s=style?JSON.parse(JSON.stringify(style)):{};s.fill={patternType:'solid',fgColor:{rgb:'FFFF00'},bgColor:{rgb:'FFFF00'}};return s;}
function styleObj(cell){if(!cell)return null;if(!cell.s||typeof cell.s!=='object')cell.s={};return cell.s;}
function forceFont(cell){var s=styleObj(cell);if(!s)return;s.font=Object.assign({},s.font||{},{name:'Angsana New',sz:15});}
function forceCenter(cell){var s=styleObj(cell);if(!s)return;s.alignment=Object.assign({},s.alignment||{},{horizontal:'center',vertical:'center'});}
function finalizeStatementSheet(ws){if(!ws)return;Object.keys(ws).forEach(function(addr){if(addr.charAt(0)==='!')return;forceFont(ws[addr]);});['H5','H6','J5','J6','L5','L6'].forEach(function(addr){if(ws[addr])forceCenter(ws[addr]);});var range=XLSX.utils.decode_range(ws['!ref']||'A1:L120');for(var r=7;r<=range.e.r+1;r++){var current=ws['J'+r],prior=ws['L'+r];if(current&&prior){current.z=prior.z||'#,##0.00;[Red](#,##0.00);-';if(typeof current.s==='object'&&typeof prior.s==='object'){current.s.numFmt=prior.s.numFmt||current.s.numFmt;current.s.alignment=Object.assign({},current.s.alignment||{},{horizontal:'right'});}}}ws['!pageSetup']={paperSize:9,orientation:'portrait',fitToWidth:1,fitToHeight:0,scale:100};ws['!margins']={left:0.25,right:0.25,top:0.5,bottom:0.5,header:0.2,footer:0.2};ws['!rows']=ws['!rows']||[];for(var i=0;i<range.e.r+1;i++){if(!ws['!rows'][i])ws['!rows'][i]={};if(i>=6&&!ws['!rows'][i].hpt)ws['!rows'][i].hpt=18.5;}ws['!rowBreaks']=[];for(var br=39;br<range.e.r+1;br+=39)ws['!rowBreaks'].push({id:br,max:16383,man:1});}
function generateWorkbookV2(mapped){var array=genExcel(mapped),wb=XLSX.read(array,{type:'array',cellStyles:true,cellNF:true,cellDates:true,bookFiles:true}),ws=wb.Sheets['Pending 68'],start=7;for(var i=0;i<mapped.length;i++){var r=start+i,a=mapped[i],key=String(a.account||a.no||'').replace(/-/g,''),prior=a.matchedDetail||V2.priorDetails[key]||{},sa=ws['A'+r]&&ws['A'+r].s,sb=ws['B'+r]&&ws['B'+r].s;ws['A'+r]={v:a.account||a.no||'',t:'s'};ws['B'+r]={v:a.name||a.desc||'',t:'s'};if(prior.pending)ws['M'+r]={v:prior.pending,t:'s'};if(sa)ws['A'+r].s=sa;if(sb)ws['B'+r].s=sb;if(!a.idx){for(var c=0;c<13;c++){var addr=XLSX.utils.encode_col(c)+r,cell=ws[addr]||{v:'',t:'s'};cell.s=yellowStyle(cell.s);ws[addr]=cell;}}}var last=start+mapped.length-1;ws['!ref']='A1:M'+Math.max(last,59);['BS-PL','BS-PL (E)'].forEach(function(sn){finalizeStatementSheet(wb.Sheets[sn]);});return XLSX.write(wb,{bookType:'xlsx',type:'array',compression:true,cellStyles:true,cellNF:true});}
function missingFiles(){var x=[];if(!V2.files.tb||!V2.tb)x.push('Trial Balance (TB)');if(!V2.files.prior||!Object.keys(V2.priorMap).length)x.push('Prior Year T2/T3');return x;}
function statementBalanceCheck(mapped){var assets=0,liabilities=0,equity=0,profit=0;mapped.forEach(function(a){var p=String(a.account||a.no||'').replace(/-/g,'').charAt(0),bal=(a.dr||0)-(a.cr||0);if(p==='1')assets+=bal;else if(p==='2')liabilities-=bal;else if(p==='3')equity-=bal;else if(/[4-9]/.test(p))profit-=bal;});var equityAndProfit=equity+profit,diff=assets-(liabilities+equityAndProfit);return{assets:assets,liabilities:liabilities,equityAndProfit:equityAndProfit,difference:diff,ok:Math.abs(diff)<1};}
